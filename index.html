<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S & S | Do You Love Me?</title>
    <style>
        body {
            background-color: #0d0016; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            color: #d8c2ff;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease-in-out; 
        }

        .container {
            text-align: center;
            background-color: rgba(26, 0, 43, 0.9);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #5a0099;
            box-shadow: 0 0 20px #8a2be2;
            position: relative; 
            overflow: hidden; 
        }

        h1 {
            color: #b300b3;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #800080;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            position: relative; 
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease; 
            outline: none;
        }

        .yes-btn {
            background-color: #ff3333;
            color: white;
            box-shadow: 0 0 10px #ff0000;
        }

        .yes-btn:hover {
            background-color: #cc0000;
            box-shadow: 0 0 20px #ff3333;
        }

        .no-btn {
            background-color: #4d0099;
            color: #d8c2ff;
            border: 2px solid #8a2be2;
            position: relative; 
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Do you love me, S?</h1>
        <div class="buttons">
            <button class="yes-btn" id="yesBtn">Yes</button>
            <button class="no-btn" id="noBtn">No</button>
        </div>
    </div>

    <script>
                const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const body = document.body;
        const container = document.querySelector('.container');
        const h1 = document.querySelector('h1'); 

        let yesScale = 1;

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('click', moveButton);

        function moveButton() {
            const containerWidth = container.offsetWidth;
            const containerHeight = container.offsetHeight;
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;

            const newLeft = Math.random() * (containerWidth - btnWidth);
            const newTop = Math.random() * (containerHeight - btnHeight);

            noBtn.style.position = 'absolute';
            noBtn.style.left = `${newLeft}px`;
            noBtn.style.top = `${newTop}px`;

            body.style.backgroundImage = "url('no.jpg')"; 
        }

        yesBtn.addEventListener('click', () => {
            yesScale += 0.5; 
            yesBtn.style.transform = `scale(${yesScale})`; 

            body.style.backgroundImage = "url('yes.jpg')"; 
            
            h1.innerHTML = "I Love You Too! ❤️";
            
            noBtn.style.display = 'none';
        });
    </script>
</body>
</html>
